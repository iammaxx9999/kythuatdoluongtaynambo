##############################################################################
# Nginx cho website + CMS (Node.js chạy sau reverse proxy)
#
# CÁCH DÙNG trên VPS Ubuntu:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/candien
#   2. Thay TENMIEN.COM bằng tên miền thật (sửa cả 4 chỗ)
#   3. sudo ln -s /etc/nginx/sites-available/candien /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d TENMIEN.COM -d www.TENMIEN.COM
#      (certbot tự chèn phần SSL và tự chuyển hướng HTTP -> HTTPS)
#
# LƯU Ý QUAN TRỌNG: chạy sau Nginx thì trong .env phải đặt TRUST_PROXY=1.
# Không đặt thì mọi request đều mang IP 127.0.0.1, và giới hạn "sai mật khẩu
# 6 lần" sẽ tính chung cho tất cả người dùng - một người sai là cả nhà bị khóa.
##############################################################################

# Gom mọi biến thể tên miền về MỘT địa chỉ chuẩn, tốt cho SEO.
# Chọn có www hay không thì giữ nguyên về sau, đừng đổi qua lại.
server {
    listen 80;
    listen [::]:80;
    server_name www.TENMIEN.COM;
    return 301 https://TENMIEN.COM$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name TENMIEN.COM;

    # Certbot sẽ thay khối này bằng cấu hình HTTPS + chuyển hướng.
    # Trước khi có SSL thì vẫn phục vụ bình thường qua HTTP.

    # Kích thước tệp tải lên: phải LỚN HƠN UPLOAD_MAX_MB trong .env,
    # nếu không Nginx chặn trước khi Node kịp trả thông báo lỗi tử tế.
    client_max_body_size 20m;

    # ---------- Nén ----------
    # Để Nginx nén, Node khỏi phải làm (và khỏi thêm thư viện).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml;

    # ---------- Nhật ký ----------
    access_log /var/log/nginx/candien.access.log;
    error_log  /var/log/nginx/candien.error.log warn;

    # ---------- Chuyển tiếp vào Node ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Ba header dưới là thứ Node cần để biết địa chỉ thật của khách.
        # Thiếu X-Forwarded-Proto thì app tưởng đang chạy HTTP và sinh sai
        # địa chỉ trong sitemap.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- Chặn quét dò trang quản trị ----------
    # Bot dò /cms, /admin, /wp-admin… suốt ngày. Nếu bạn đã đổi CMS_PATH thành
    # chuỗi khó đoán thì mở khối này để chặn luôn từ Nginx, Node khỏi bị làm ồn.
    #
    # location ~ ^/(cms|admin|wp-admin|wp-login\.php|phpmyadmin) {
    #     return 404;
    # }

    # ---------- Chặn truy cập tệp ẩn ----------
    location ~ /\. {
        deny all;
        access_log off;
    }
}
